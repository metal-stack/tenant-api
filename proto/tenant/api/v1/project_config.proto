syntax = "proto3";

package tenant.api.v1;

import "google/protobuf/any.proto";
import "tenant/api/v1/common.proto";
import "tenant/api/v1/meta.proto";

// ProjectConfigService provides service methods to work with project configs
service ProjectConfigService {
  // Create a project config
  rpc Create(ProjectConfigServiceCreateRequest) returns (ProjectConfigServiceCreateResponse);
  // Update a project config
  rpc Update(ProjectConfigServiceUpdateRequest) returns (ProjectConfigServiceUpdateResponse);
  // Delete a project config
  rpc Delete(ProjectConfigServiceDeleteRequest) returns (ProjectConfigServiceDeleteResponse);
  // Get a project config
  rpc Get(ProjectConfigServiceGetRequest) returns (ProjectConfigServiceGetResponse);
  // List project configs
  rpc List(ProjectConfigServiceListRequest) returns (ProjectConfigServiceListResponse);
}

// ProjectConfig is the database model
message ProjectConfig {
  // Meta of the project config
  Meta meta = 1;
  // Id of the project config
  string id = 2;
  // Name of the project config
  string name = 3;
  // ProjectId is the id of the project this config belongs to
  string project_id = 4;
  // Config holds the arbitrary configuration payload for this project
  // Config contains the value and the type_url, that points to the serialized type of the value.
  google.protobuf.Any config = 5;
}

// ProjectConfigServiceCreateRequest is the request payload to create a project config
message ProjectConfigServiceCreateRequest {
  // ProjectConfig to create
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceCreateResponse is the response payload of requests
message ProjectConfigServiceCreateResponse {
  // ProjectConfig
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceUpdateRequest is the request payload to update a project config
message ProjectConfigServiceUpdateRequest {
  // ProjectConfig to update
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceUpdateResponse is the response payload of requests
message ProjectConfigServiceUpdateResponse {
  // ProjectConfig
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceDeleteRequest is the request payload to delete a project config
message ProjectConfigServiceDeleteRequest {
  // Id of the project config to delete
  string id = 1;
}

// ProjectConfigServiceDeleteResponse is the response payload of requests
message ProjectConfigServiceDeleteResponse {
  // ProjectConfig
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceGetRequest is the request payload to get a project config
message ProjectConfigServiceGetRequest {
  // Id of the project config to get
  string id = 1;
}

// ProjectConfigServiceGetResponse is the response payload of requests
message ProjectConfigServiceGetResponse {
  // ProjectConfig
  ProjectConfig project_config = 1;
}

// ProjectConfigServiceListRequest is the request payload to list project configs
message ProjectConfigServiceListRequest {
  // Paging spec of this list request
  Paging paging = 1;
  // Annotations of project configs to list
  map<string, string> annotations = 2;

  // Id of the project config to list
  optional string id = 3;
  // Name of project configs to list
  optional string name = 4;
  // Project id of the project for the configs to list
  optional string project_id = 5;
  // Labels of project configs to list
  repeated string labels = 6;
}

// ProjectConfigServiceListResponse is the response payload of project config list requests
message ProjectConfigServiceListResponse {
  // ProjectConfigs
  repeated ProjectConfig project_config = 1;
  // next_page is used for pagination, returns the next page to be fetched and must then be provided in the list request.
  optional uint64 next_page = 2;
}
